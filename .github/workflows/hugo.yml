name: Build and Deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - redesign-2025   # baue die Vorschau, solange du am Redesign arbeitest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nutze die Hugo-Extended-Version (für SCSS etc.)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # WICHTIG: Für die Vorschau-URL im Unterordner (falls du das nutzt)
      # Setze in deiner hugo.yaml baseURL entsprechend; Beispiel:
      # baseURL: "https://schaeftlarnerkonzerte.github.io/"
      # oder für Unterordner-Vorschau:
      # baseURL: "https://schaeftlarnerkonzerte.github.io/redesign-2025/"

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
