yaml

baseURL: "https://schaeftlarnerkonzerte.github.io"
languageCode: "de"
title: "Schäftlarner Konzerte"
defaultContentLanguage: "de"
theme: universal

params:
  description: "Die Konzertreihe südlich von München. Seit 1968."
  keywords: "Schäftlarner Konzerte, Mozart, Haydn, Bach, Schubert, klassische Musik, Benno Forster, Michael Forster, Kloster Schäftlarn, Kirchenmusik, Barockmusik"
  author: "Schäftlarner Konzerte e.V."

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false

security:
  funcs:
    getenv:
      - "^HUGO_"
      - "^WC_"

menu:
  main:
    - name: "Programm"
      url: "/programm/"
      weight: 1
    - name: "Tickets"
      url: "/tickets/"
      weight: 2
    - name: "Förderkreis"
      url: "/foerderkreis/"
      weight: 3
    - name: "Kontakt"
      url: "/contact/"
      weight: 4
