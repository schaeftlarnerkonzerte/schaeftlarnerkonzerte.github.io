{{- /* Header partial for Schäftlarner Konzerte (custom override) */ -}}
<header class="border-bottom shadow-sm bg-white sticky-top">
  <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
    <div class="container">
      <!-- Logo / Brand -->
      <a class="navbar-brand fw-semibold text-primary" href="{{ "/" | relLangURL }}">
        <img src="/img/logo.png" alt="Schäftlarner Konzerte" height="40" class="me-2 align-middle">
        Schäftlarner Konzerte
      </a>

      <!-- Mobile Menu Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
        aria-controls="mainNavbar" aria-expanded="false" aria-label="Menü öffnen">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
        <ul class="navbar-nav mb-2 mb-lg-0">
          {{ range .Site.Menus.main }}
          <li class="nav-item">
            <a class="nav-link px-3{{ if .IsMenuCurrent "main" . }} active fw-bold text-primary{{ end }}" href="{{ .URL }}">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </nav>
</header>
